<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vodojem Pávice</title>

<style>
:root{
  --accent:#0078d7;
  --accent-light:#e6f2ff;
}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:#f6f8fa;color:#222;
  display:flex;justify-content:center;padding:14px;
}
.container{width:100%;max-width:900px}

header{
  display:flex;align-items:center;gap:12px;
  background:#fff;padding:14px;border-radius:12px;
  box-shadow:0 6px 14px rgba(0,0,0,0.06);
  margin-bottom:14px;
}

.signal-icon{
  width:82px;height:82px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;
}

.stat-card{
  background:linear-gradient(135deg,var(--accent-light),#ffffff);
  padding:22px;
  border-radius:16px;
  box-shadow:0 10px 22px rgba(0,0,0,0.08);
  margin-bottom:18px;
  text-align:center;
}

.stat-title{
  font-weight:700;
  font-size:0.95rem;
  color:#555;
  margin-bottom:10px;
}

.stat-value{
  font-size:2.6rem;
  font-weight:900;
  color:var(--accent);
}

.stat-date{
  margin-top:6px;
  font-size:0.95rem;
  color:#666;
}

.svg-wrap{
  background:#fff;
  padding:12px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.05);
  margin-bottom:14px;
  text-align:center;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  box-shadow:0 6px 14px rgba(0,0,0,0.05);
  margin-bottom:12px;
}

.title-row{
  color:var(--accent);
  font-weight:700;
  margin-bottom:8px;
}

.value{
  font-size:2rem;
  font-weight:800;
}

.unit{
  color:#666;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00c853,#00aaff);
  transition:width .6s ease;
}

.range-buttons{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:10px 0;
}

.range-buttons button{
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}

.range-buttons button.active{
  background:var(--accent);
  color:#fff;
}

.charts{
  margin-top:8px;
  background:#fff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 6px 14px rgba(0,0,0,0.05);
}

canvas{
  width:100%!important;
  height:420px!important;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="signal-icon">📡</div>

  <div>
    <h1>Vodojem Pávice</h1>

    Síla signálu:
    <span id="signalStrength">–</span>

    <span id="errorMini"
      style="font-size:0.7rem;color:#999;margin-left:6px;">
    </span>

    <br>

    <span id="lastUpdate"
      style="font-size:0.9rem;color:#666;">
    </span>
  </div>
</header>

<div class="stat-card">
  <div class="stat-title">Počasí – Pávice</div>

  <div class="stat-value" id="weatherTemp">– °C</div>

  <div class="stat-date" id="weatherDesc">–</div>
</div>

<div class="svg-wrap">

<svg viewBox="0 0 500 400" width="340" height="260">

<defs>
<clipPath id="tankClip">
<path d="M 30,380 L 470,380 C 460,260 430,140 350,50 L 150,50 C 70,140 40,260 30,380 Z"/>
</clipPath>
</defs>

<path
d="M 30,380 L 470,380 C 460,260 430,140 350,50 L 150,50 C 70,140 40,260 30,380 Z"
fill="#f7f9fb"
stroke="#cfcfcf"/>

<g clip-path="url(#tankClip)">
<rect
id="waterRect"
x="0"
y="380"
width="500"
height="0"
fill="#2a8be8"/>
</g>

<text
id="svgLiters"
x="250"
y="170"
fill="#000"
font-size="30"
font-weight="800"
text-anchor="middle">
— l
</text>

<text
id="svgPercent"
x="250"
y="205"
fill="#000"
font-size="26"
font-weight="900"
text-anchor="middle">
— %
</text>

</svg>
</div>

<div class="card">
  <div class="title-row">💧 Hladina</div>

  <div>
    <span class="value" id="levelValue">–</span>
    <span class="unit">cm</span>
  </div>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
</div>

<div class="card">
  <div class="title-row">🚰 Přítok</div>

  <div>
    <span class="value" id="flowValue">–</span>
    <span class="unit">L/min</span>
  </div>
</div>

<div class="card">
  <div class="title-row">⏳ Odhad zbytku vody</div>

  <div>
    <span class="value" id="daysLeftValue">–</span>
    <span class="unit" id="daysLeftUnit"></span>
  </div>

  <div class="stat-date" id="daysLeftDesc">–</div>
</div>

<div class="range-buttons">
  <button class="active" onclick="setRange(7,this)">Týden</button>
  <button onclick="setRange(30,this)">Měsíc</button>
  <button onclick="setRange(365,this)">Rok</button>
</div>

<div class="charts">
  <canvas id="levelChart"></canvas>
</div>

<div class="charts">
  <canvas id="flowChart"></canvas>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// ===== výpočet objemu =====

function getLiters(height_cm){

  const L=5.9;
  const slope=0.15;
  const maxH=2.45;

  const profile=[
    [0,0],
    [4.4,0],
    [3.12,2.45],
    [1.28,2.45]
  ];

  let h0=Number(height_cm)/100;

  if(isNaN(h0)||h0<=0)return 0;

  if(h0>maxH)h0=maxH;

  const h1=Math.max(0,h0-slope);

  function polygonArea(p){

    let a=0;

    for(let i=0;i<p.length;i++){

      const j=(i+1)%p.length;

      a+=p[i][0]*p[j][1]-p[j][0]*p[i][1];
    }

    return Math.abs(a)/2;
  }

  function clip(p,h){

    const out=[];

    for(let i=0;i<p.length;i++){

      const A=p[i];
      const B=p[(i+1)%p.length];

      const Ain=A[1]<=h;
      const Bin=B[1]<=h;

      if(Ain)out.push([A[0],A[1]]);

      if(Ain^Bin){

        const t=(h-A[1])/(B[1]-A[1]);

        out.push([
          A[0]+t*(B[0]-A[0]),
          h
        ]);
      }
    }

    return out;
  }

  function areaAt(d){

    if(d<=0)return 0;

    const c=clip(profile,d);

    return c.length<3 ? 0 : polygonArea(c);
  }

  function integrate(d0,d1){

    let steps=300;

    if(steps%2)steps++;

    const dx=L/steps;

    let sum=0;

    for(let i=0;i<=steps;i++){

      const t=i/steps;

      const d=d0+(d1-d0)*t;

      const A=areaAt(d);

      const k=
        (i===0||i===steps)
        ? 1
        : (i%2 ? 4 : 2);

      sum+=k*A;
    }

    return sum*dx/3;
  }

  return integrate(h0,h1)*1000;
}

let feedsAll=[];
let levelChart;
let flowChart;
let rangeDays=7;
let lowLevelNow=false;

// ===== filtr nesmyslných výkyvů (spike) v hladině =====
// Senzor občas ojediněle pošle nesmyslnou hodnotu (např. skok na 200cm,
// když skutečná hladina je 70cm), a hned další záznam je zase v pořádku.
// Takový osamocený výkyv poznáme podle toho, že se hodně liší od hodnoty
// PŘED i PO něm, zatímco hodnoty před a po sobě jsou navzájem blízko.
// Takto označené záznamy se nastaví na null - dál se v aplikaci nikde
// nezobrazí ani nepoužijí (graf, výpočet objemu, odhad dní atd.).

const LEVEL_SPIKE_JUMP_CM = 40;      // co považujeme za nesmyslný skok oproti poslední dobré hodnotě
const LEVEL_SPIKE_EDGE_JUMP_CM = 70; // přísnější limit, když skok nejde potvrdit návratem k normálu (poslední záznam)

function despikeLevelData(feeds){

  // seznam indexů (v poli feeds) s platnou číselnou hodnotou field2
  const idxs=[];
  const vals=[];

  feeds.forEach((f,i)=>{

    const v=parseFloat(f.field2);

    if(!isNaN(v)&&v>0){
      idxs.push(i);
      vals.push(v);
    }
  });

  const badLocal=new Array(vals.length).fill(false);

  // lastGood = poslední hodnota, kterou jsme uznali za reálnou (ne výkyv).
  // Díky tomu se u sebe jdoucí výkyvy neporovnávají mezi sebou navzájem,
  // ale vždy vůči poslednímu ověřenému "normálu".
  let lastGood=null;

  for(let k=0;k<vals.length;k++){

    const v=vals[k];
    const next=(k<vals.length-1) ? vals[k+1] : null;

    if(lastGood===null){

      // úplně první platný záznam v okně - není s čím srovnat dozadu.
      // Zkontrolujeme aspoň, jestli hned po něm nenásledují dvě navzájem
      // blízké hodnoty, vůči kterým je právě tenhle první odlehlý.
      const next2=(k<vals.length-2) ? vals[k+2] : null;

      if(next!==null && next2!==null &&
         Math.abs(v-next)>LEVEL_SPIKE_JUMP_CM &&
         Math.abs(next-next2)<=LEVEL_SPIKE_JUMP_CM){

        badLocal[k]=true;
        continue;
      }

      lastGood=v;
      continue;
    }

    const diffPrev=Math.abs(v-lastGood);

    if(diffPrev<=LEVEL_SPIKE_JUMP_CM){
      lastGood=v;
      continue;
    }

    if(next===null){

      // poslední záznam v okně - nejde potvrdit návratem k normálu,
      // proto přísnější limit, ať omylem nesmažeme reálný prudší trend
      if(diffPrev>LEVEL_SPIKE_EDGE_JUMP_CM){
        badLocal[k]=true;
      }else{
        lastGood=v;
      }

      continue;
    }

    const diffNextToGood=Math.abs(next-lastGood);

    if(diffNextToGood<=LEVEL_SPIKE_JUMP_CM){

      // hned další záznam se vrací k normálu -> tohle byl osamocený výkyv
      badLocal[k]=true;

    }else{

      // i další hodnota je daleko od poslední dobré hodnoty - nevypadá
      // to jako jednorázový výkyv, spíš reálná změna -> necháme být
      lastGood=v;
    }
  }

  let removed=0;

  badLocal.forEach((bad,k)=>{
    if(bad){
      feeds[idxs[k]].field2=null;
      removed++;
    }
  });

  return removed;
}

// ===== odhad počtu dní do vyčerpání vody =====
// Bere hladinu (field2) za posledních N dní, přepočítá na objem (litry)
// a lineární regresí spočítá trend (litry/den). Pokud objem klesá,
// odhadne, za kolik dní dojde na 0.

const DAYS_LEFT_WINDOW = 3; // kolik dní zpětně se bere pro výpočet trendu

function estimateDaysRemaining(windowDays=DAYS_LEFT_WINDOW){

  const now=Date.now();
  const cutoff=now-windowDays*86400000;

  const points=feedsAll
    .filter(f=>new Date(f.created_at).getTime()>=cutoff)
    .map(f=>{

      const level=parseFloat(f.field2);

      if(isNaN(level)||level<=0)return null;

      return {
        t:new Date(f.created_at).getTime(),
        h:level,
        vol:getLiters(level)
      };
    })
    .filter(p=>p!==null);

  if(points.length<4)return null;

  // Robustní odhad: zprůměrujeme pár prvních a pár posledních záznamů v okně,
  // aby jeden šumový/chybný vzorek neposunul výsledek (na rozdíl od regrese
  // přes všechny body, kterou dokáže "rozmělnit" nerovnoměrné vzorkování).
  const edgeCount=Math.max(1, Math.min(5, Math.floor(points.length/4)));

  const firstSlice=points.slice(0, edgeCount);
  const lastSlice=points.slice(-edgeCount);

  const avg=(arr,key)=>arr.reduce((s,p)=>s+p[key],0)/arr.length;

  const tStart=avg(firstSlice,"t");
  const tEnd=avg(lastSlice,"t");

  const elapsedDays=(tEnd-tStart)/86400000;

  if(elapsedDays<=0)return null;

  const volStart=avg(firstSlice,"vol");
  const volEnd=avg(lastSlice,"vol");

  const hStart=avg(firstSlice,"h");
  const hEnd=avg(lastSlice,"h");

  const slopePerDay=(volEnd-volStart)/elapsedDays;     // litry/den, záporné = ubývá
  const cmSlopePerDay=(hEnd-hStart)/elapsedDays;        // cm/den, záporné = ubývá

  const currentVolume=points[points.length-1].vol;
  const currentHeight=points[points.length-1].h;

  return {slopePerDay, cmSlopePerDay, currentVolume, currentHeight, windowDays, samples:points.length, elapsedDays};
}

function updateDaysLeft(){

  const el=document.getElementById("daysLeftValue");
  const unitEl=document.getElementById("daysLeftUnit");
  const descEl=document.getElementById("daysLeftDesc");

  const est=estimateDaysRemaining();

  if(!est || est.samples<4){

    el.textContent="–";
    unitEl.textContent="";
    descEl.textContent="Nedostatek dat pro odhad";

    return;
  }

  const declineRate=-est.slopePerDay;   // kladné číslo = úbytek l/den

  // "šum" - pokud je pokles zanedbatelný, nebereme to jako reálný spotřebovávaný trend
  if(declineRate<=1){

    el.textContent="∞";
    unitEl.textContent="";
    descEl.textContent="Hladina neklesá (spíš stoupá / stabilní)";

    return;
  }

  const days=est.currentVolume/declineRate;

  const targetDate=new Date(Date.now()+days*86400000);

  el.textContent=days.toFixed(1);
  unitEl.textContent="dní";

  descEl.textContent=
    "Při aktuálním trendu prázdná cca "+
    targetDate.toLocaleDateString("cs-CZ");

  if(days<3){
    el.style.color="#d32f2f";
  }else if(days<7){
    el.style.color="#f57c00";
  }else{
    el.style.color="var(--accent)";
  }
}

// ===== načtení dat =====

async function fetchData(){

  const r=await fetch(
    "https://api.thingspeak.com/channels/1214142/feeds.json?results=8000&api_key=SGHZ5KIDVYK3BG1M"
  );

  const j=await r.json();

  feedsAll=j.feeds.sort(
    (a,b)=>new Date(a.created_at)-new Date(b.created_at)
  );

  despikeLevelData(feedsAll);

  const latest=feedsAll.at(-1);

  // pro hladinu bereme poslední ZÁZNAM S PLATNOU (nevyfiltrovanou) hodnotou -
  // kdyby byl spike zrovna v posledním vzorku, nezobrazíme nesmysl
  const latestLevelFeed=[...feedsAll]
    .reverse()
    .find(f=>{
      const v=parseFloat(f.field2);
      return !isNaN(v)&&v>0;
    });

  const level=latestLevelFeed ? parseFloat(latestLevelFeed.field2) : NaN;
  const flow=parseFloat(latest.field3);

  document.getElementById("levelValue").textContent=
    level.toFixed(1);

  const lowLevel = !isNaN(level) && level < 100;

  document.getElementById("levelValue").style.color =
    lowLevel ? "#d32f2f" : "#222";

  lowLevelNow = lowLevel;

  document.getElementById("flowValue").textContent=
    flow.toFixed(2);

  document.getElementById("signalStrength").textContent=
    latest.field1 || "–";

  const volume=getLiters(level);

  let percent=(volume/44262)*100;

  if(percent>100)percent=100;

  document.getElementById("svgLiters").textContent=
    Math.round(volume)+" l";

  document.getElementById("svgPercent").textContent=
    Math.round(percent)+" %";

  // barva čísel v nádrži: červená pokud je hladina nižší než 100 cm
  const numberColor = lowLevel ? "#d32f2f" : "#000";

  document.getElementById("svgLiters").setAttribute("fill", numberColor);
  document.getElementById("svgPercent").setAttribute("fill", numberColor);

  const h=(percent/100)*330;

  document.getElementById("waterRect")
    .setAttribute("y",380-h);

  document.getElementById("waterRect")
    .setAttribute("height",h);

  document.getElementById("progressFill").style.width=
    (level/243)*100+"%";

  document.getElementById("progressFill").style.background =
    lowLevel
      ? "linear-gradient(90deg,#ff5252,#d32f2f)"
      : "linear-gradient(90deg,#00c853,#00aaff)";

  const diff=
    (Date.now()-new Date(latest.created_at))/60000;

  const el=document.getElementById("lastUpdate");

  if(diff>115){

    el.textContent=
      "⚠ Neaktualizováno "+Math.round(diff)+" min";

    el.style.color="#c62828";

  }else{

    el.textContent=
      "Aktualizace před "+Math.round(diff)+" min";

    el.style.color="#666";
  }

  renderCharts();
  updateDaysLeft();
}

// ===== přepínání rozsahu =====

function setRange(d,b){

  rangeDays=d;

  document
    .querySelectorAll(".range-buttons button")
    .forEach(x=>x.classList.remove("active"));

  b.classList.add("active");

  renderCharts();
}

// ===== grafy =====

function renderCharts(){

  const now=Date.now();

  const filtered=feedsAll.filter(f=>
    now-new Date(f.created_at)<=rangeDays*86400000
  );

  const labels=filtered.map(f=>{

    const d=new Date(f.created_at);

    return rangeDays<=7

      ? d.toLocaleString("cs-CZ",{
          day:"2-digit",
          month:"2-digit",
          hour:"2-digit",
          minute:"2-digit"
        })

      : d.toLocaleDateString("cs-CZ");
  });

  const levelData=filtered.map(f=>{

    const v=parseFloat(f.field2);

    return (isNaN(v)||v<=0)
      ? null
      : v;
  });

  const flowData=filtered.map(f=>{

    const v=parseFloat(f.field3);

    return (isNaN(v)||v<0)
      ? null
      : v;
  });

  // ===== ERRORY ZA DNEŠNÍ DEN =====

  let errorToday=0;

  const today=new Date();

  const todayDay=today.getDate();
  const todayMonth=today.getMonth();
  const todayYear=today.getFullYear();

  feedsAll.forEach(f=>{

    const d=new Date(f.created_at);

    const sameDay=
      d.getDate()===todayDay &&
      d.getMonth()===todayMonth &&
      d.getFullYear()===todayYear;

    if(sameDay){

      const v=parseFloat(f.field2);

      if(isNaN(v)||v<=0){
        errorToday++;
      }
    }
  });

  document.getElementById("errorMini").textContent=
    "· err dnes "+errorToday;

  const options={

    maintainAspectRatio:false,

    responsive:true,

    interaction:{
      mode:"nearest",
      intersect:true
    },

    plugins:{
      tooltip:{
        enabled:true,

        callbacks:{
          label:function(context){

            return (
              context.dataset.label+
              ": "+
              context.parsed.y
            );
          }
        }
      }
    },

    scales:{
      y:{
        beginAtZero:true
      }
    }
  };

  // ===== vytvoření grafů =====

  const levelColor = lowLevelNow ? "#d32f2f" : "#36A2EB";

  if(!levelChart){

    levelChart=new Chart(

      document.getElementById("levelChart"),

      {
        type:"line",

        data:{
          labels,

          datasets:[{
            label:"Hladina",
            data:levelData,
            spanGaps:true,
            tension:0.3,
            pointRadius:3,
            pointHoverRadius:6,
            borderColor:levelColor,
            backgroundColor:levelColor
          }]
        },

        options
      }
    );

    flowChart=new Chart(

      document.getElementById("flowChart"),

      {
        type:"line",

        data:{
          labels,

          datasets:[{
            label:"Přítok",
            data:flowData,
            spanGaps:true,
            tension:0.3,
            pointRadius:3,
            pointHoverRadius:6
          }]
        },

        options
      }
    );

  }else{

    levelChart.data.labels=labels;
    levelChart.data.datasets[0].data=levelData;
    levelChart.data.datasets[0].borderColor=levelColor;
    levelChart.data.datasets[0].backgroundColor=levelColor;
    levelChart.update();

    flowChart.data.labels=labels;
    flowChart.data.datasets[0].data=flowData;
    flowChart.update();
  }
}

// ===== počasí =====

async function fetchWeather(){

  const r=await fetch(
    "https://api.open-meteo.com/v1/forecast?latitude=50.23&longitude=12.86&current_weather=true"
  );

  const d=await r.json();

  document.getElementById("weatherTemp").textContent=
    d.current_weather.temperature.toFixed(1)+" °C";

  document.getElementById("weatherDesc").textContent=
    "Vítr "+d.current_weather.windspeed+" km/h";
}

// ===== start =====

fetchData();
fetchWeather();

setInterval(fetchData,30000);
setInterval(fetchWeather,600000);

</script>

</body>
</html>
